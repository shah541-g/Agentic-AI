; Application config                  <- full-line comment (also: # comment)
app_name = LogLens
version = 1.2                          ; inline comment (needs whitespace before ; or #)

[server]
host = 0.0.0.0          ; bind address
port = 8080
debug = yes
allowed_hosts = localhost, 127.0.0.1, example.com
motd = "Welcome, \"friend\"\nEnjoy!"

[database]
url = postgres://user:pass@localhost/db#primary    ; '#' without leading space is NOT a comment
pool_size = 10
description = This is a long description
    that continues on a second line
    and a third line.
replicas =
    db1.internal
    db2.internal
    db3.internal
query = SELECT * \
    FROM users
