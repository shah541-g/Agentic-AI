[_global]
app_name = str, required
version  = str

[server]
host          = str, required
port          = int, required, min=1, max=65535
debug         = bool, default=false
allowed_hosts = list[str]
log_level     = str, default=info, choices=debug|info|warning|error

[database]
url       = str, required
pool_size = int, default=5, min=1, max=100
replicas  = list[str]
