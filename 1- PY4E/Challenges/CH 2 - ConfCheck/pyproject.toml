[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "confcheck"
version = "0.1.0"
description = "A regex-only INI-style config parser, linter, and schema validator."
readme = "README.md"
authors = [{ name = "ConfCheck Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
confcheck = "confcheck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["confcheck*"]
