[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "A terminal log parser that turns messy log files into clean, filterable, exportable tables using regex presets, custom regex, and regex suggestion."
readme = "README.md"
authors = [{ name = "LogLens Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loglens*"]
